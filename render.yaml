services:
  - type: web
    name: anidaso-voice-momo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 10000
      - key: PUBLIC_CALLBACK_URL
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_PHONE_NUMBER
        sync: false
      - key: AT_VOICE_URL
        value: https://voice.africastalking.com/call
      - key: AT_TRANSFER_URL
        value: https://voice.africastalking.com/callTransfer
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TTS_KEY
        sync: false
      - key: GROQ_LLM_KEY
        sync: false
      - key: GROQ_AUDIO_AGENT_KEY
        sync: false
      - key: TWI_ASR_PROVIDER
        value: groq
      - key: UG_HCI_LAB_API_KEY
        sync: false
      - key: UG_HCI_LAB_URL
        value: https://lab-subscription-platform.vercel.app
      - key: CUSTOMER_SUPPORT_PHONE_NUMBER
        sync: false
      - key: AUDIO_MENU_URL
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
      - key: VOICE_WEBHOOK_TIMEOUT_MS
        value: "12000"
      - key: MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      - key: MOMO_ENVIRONMENT
        value: sandbox
      - key: MOMO_CURRENCY
        value: GHS
      - key: MOMO_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_API_USER_ID
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_CALLBACK_HOST
        value: webhook.site
